# HLD example: neutral e-commerce checkout platform. Icons are optional (path or URL), none shipped.
name: checkout-hld
title: High Level Design - Checkout Platform
subtitle: Example architecture generated by diagramkit (zones on a grid, auto-routed orthogonal edges)
theme: default
columns: 3
zones:
  - {id: clients, label: "Zone A - Clients", color: blue, row: 0, col: 0}
  - {id: platform, label: "Zone B - Platform services", color: green, row: 0, col: 1, cols: 4}
  - {id: external, label: "Zone C - External", color: gray, row: 0, col: 2}
  - {id: ops, label: "Zone D - Operations", color: orange, row: 1, col: 0}
  - {id: data, label: "Zone E - Data and messaging", color: purple, row: 1, col: 1, cols: 3}
nodes:
  - {id: shopper, zone: clients, label: "Shopper", color: gray}
  - {id: web, zone: clients, label: "Web storefront\n(SPA)"}
  - {id: mobile, zone: clients, label: "Mobile app"}

  - {id: gw, zone: platform, label: "API Gateway (TLS, auth, rate limit)", colspan: 4}
  - {id: catalog, zone: platform, label: "Catalog\nService"}
  - {id: inventory, zone: platform, label: "Inventory\nService"}
  - {id: orders, zone: platform, label: "Order\nService"}
  - {id: payments, zone: platform, label: "Payment\nService"}

  - {id: psp, zone: external, label: "Payment provider", color: gray}
  - {id: mail, zone: external, label: "Email / SMS gateway", color: gray, dashed: true}

  - {id: console, zone: ops, label: "Admin console"}
  - {id: mon, zone: ops, label: "Metrics and alerting"}
  - {id: cache, zone: data, label: "Redis\ncart, sessions"}
  - {id: bus, zone: data, label: "Message queue\norder events"}
  - {id: pg, zone: data, label: "PostgreSQL\norders, stock"}

edges:
  - "shopper->web: browse"
  - {edge: "shopper->mobile: use", from_side: left, to_side: left}   # manual side override
  - "web->gw: HTTPS"
  - "mobile->gw: HTTPS"
  - "gw->orders: checkout"
  - "gw->catalog: search"
  - "orders->inventory: reserve"
  - "orders->payments: charge"
  - "payments->psp: authorize"
  - "orders->pg: persist"
  - "catalog->cache: cache"
  - "orders->bus: OrderPlaced"
  - "bus-->mail: notify"
  - "console->gw: admin API"
  - "mon-->pg: metrics"
legend:
  blue: "Client side"
  green: "Platform services"
  purple: "Data and messaging"
  orange: "Operations"
  gray: "External / actors"
