# HLD example: neutral e-commerce checkout platform.
# icon: builtin:<name> = generic pictograms shipped with diagramkit (see `diagramkit icons`).
# Brand logos (Redis, PostgreSQL...) are not bundled; use icon: path/to/logo.svg or a URL, e.g.
#   icon: https://cdn.simpleicons.org/redis     (check the logo's license/brand rules before publishing)
name: checkout-hld
title: High Level Design - Checkout Platform
subtitle: Example architecture generated by diagramkit (zones on a grid, auto-routed orthogonal edges)
theme: default
columns: 3
zones:
  - {id: clients, label: "Zone A - Clients", color: blue, row: 0, col: 0}
  - {id: platform, label: "Zone B - Platform services", color: green, row: 0, col: 1, cols: 4}
  - {id: external, label: "Zone C - External", color: gray, row: 0, col: 2}
  - {id: ops, label: "Zone D - Operations", color: orange, row: 1, col: 0}
  - {id: data, label: "Zone E - Data and messaging", color: purple, row: 1, col: 1, cols: 3}
nodes:
  - {id: shopper, zone: clients, label: "Shopper", color: gray, icon: "builtin:user"}
  - {id: web, zone: clients, label: "Web storefront\n(SPA)", icon: "builtin:browser"}
  - {id: mobile, zone: clients, label: "Mobile app", icon: "builtin:mobile"}

  - {id: gw, zone: platform, label: "API Gateway (TLS, auth, rate limit)", colspan: 4, icon: "builtin:gateway"}
  - {id: catalog, zone: platform, label: "Catalog\nService", icon: "builtin:server"}
  - {id: inventory, zone: platform, label: "Inventory\nService", icon: "builtin:server"}
  - {id: orders, zone: platform, label: "Order\nService", icon: "builtin:server"}
  - {id: payments, zone: platform, label: "Payment\nService", icon: "builtin:payment"}

  - {id: psp, zone: external, label: "Payment provider", color: gray, icon: "builtin:cloud"}
  - {id: mail, zone: external, label: "Email / SMS gateway", color: gray, dashed: true, icon: "builtin:mail"}

  - {id: console, zone: ops, label: "Admin console", icon: "builtin:settings"}
  - {id: mon, zone: ops, label: "Metrics and alerting", icon: "builtin:chart"}
  - {id: cache, zone: data, label: "Redis\ncart, sessions", icon: "builtin:cache"}
  - {id: bus, zone: data, label: "Message queue\norder events", icon: "builtin:queue"}
  - {id: pg, zone: data, label: "PostgreSQL\norders, stock", icon: "builtin:database"}

edges:
  - "shopper->web: browse"
  - {edge: "shopper->mobile: use", from_side: left, to_side: left}   # manual side override
  - "web->gw: HTTPS"
  - "mobile->gw: HTTPS"
  - "gw->orders: checkout"
  - "gw->catalog: search"
  - "orders->inventory: reserve"
  - "orders->payments: charge"
  - "payments->psp: authorize"
  - "orders->pg: persist"
  - "catalog->cache: cache"
  - "orders->bus: OrderPlaced"
  - "bus-->mail: notify"
  - "console->gw: admin API"
  - "mon-->pg: metrics"
legend:
  blue: "Client side"
  green: "Platform services"
  purple: "Data and messaging"
  orange: "Operations"
  gray: "External / actors"
